{% extends 'base.html' %}
{% block title %}Sign In - Smart Library System{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card-smart p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px;">
            <i class="fa-solid fa-graduation-cap fs-4"></i>
          </div>
          <h3 class="fw-bold text-dark">Welcome Back</h3>
          <p class="text-muted small">Sign in to your university library account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
          <div class="mb-3">
            <label class="form-label fw-semibold small text-dark">Campus Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
              <input type="email" name="email" id="loginEmail" class="form-control form-control-smart border-start-0" placeholder="e.g. alex@student.edu" value="{{ email or '' }}" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold small text-dark mb-0">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="password" id="loginPassword" class="form-control form-control-smart border-start-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">
                Remember this device
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-smart w-100 py-2 justify-content-center mb-4">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Library
          </button>
        </form>

        <!-- Quick Demo Fill Section for Testing & Evaluation -->
        <div class="bg-light p-3 rounded-4 border mb-4">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="fw-bold small text-dark"><i class="fa-solid fa-key text-warning me-1"></i> Demo Quick-Fill:</span>
            <span class="badge bg-secondary-subtle text-secondary small">1-Click Test</span>
          </div>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('admin@library.edu', 'Admin@123')">
              <span><i class="fa-solid fa-shield-halved me-1 text-primary"></i> <strong>Admin</strong></span>
              <small class="text-muted">admin@library.edu</small>
            </button>
            <button type="button" class="btn btn-sm btn-outline-info text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('prof.smith@library.edu', 'Staff@123')">
              <span><i class="fa-solid fa-chalkboard-user me-1 text-info"></i> <strong>Faculty Staff</strong></span>
              <small class="text-muted">prof.smith@library.edu</small>
            </button>
            <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('alex@student.edu', 'Student@123')">
              <span><i class="fa-solid fa-user-graduate me-1 text-success"></i> <strong>Student</strong></span>
              <small class="text-muted">alex@student.edu</small>
            </button>
          </div>
        </div>

        <div class="text-center small text-muted">
          Don't have an account yet? 
          <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary text-decoration-none">
            Register here
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillCredentials(email, password) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = password;
}
</script>
{% endblock %}
